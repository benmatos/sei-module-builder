<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}SEI Module Builder{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/static/alpine.min.js" defer></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <nav class="bg-blue-800 text-white px-6 py-3 shadow">
    <span class="font-bold text-lg">SEI Module Builder</span>
  </nav>
  <main class="max-w-3xl mx-auto py-8 px-4">
    {% for f in flashes %}
    <div class="mb-4 p-3 rounded {% if f.cat == 'error' %}bg-red-100 text-red-800{% else %}bg-green-100 text-green-800{% endif %}">
      {{ f.msg }}
    </div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
