[sei]
# Caminhos locais do ambiente SEI em desenvolvimento

# Diretório de módulos SEI
modulos_dir = c:/sistemas/seimgi/fontes/sei/web/modulos

# Caminho completo do ConfiguracaoSEI.php
configuracao_sei = c:/sistemas/seimgi/fontes/sei/config/ConfiguracaoSEI.php

# Binário do PHP
php_bin = c:/sistemas/php2/php.exe

# Onde guardar backups locais
backup_dir = c:/sistemas/seimgi/backups/sei-modulos

# Deploy automático após geração? (true/false)
auto_deploy = true

# Abrir log detalhado do resultado
verbose = true
